[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-language-outcomes"
version = "0.1.0"
description = "Versioned longitudinal registry and assessment layers for US dual-language research"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
analytics = ["duckdb>=1.1,<2", "pyarrow>=18,<24"]

[project.scripts]
dl-outcomes = "dl_outcomes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dl_outcomes = ["schemas/*.json"]
