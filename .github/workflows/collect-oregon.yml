
name: Collect Oregon dual-language programs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF extractor
        run: |
          python -m pip install \
            pdfplumber==0.11.7 \
            requests==2.32.3

      - name: Extract official Oregon directory
        run: |
          python collectors/oregon.py

      - name: Upload results for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oregon-dl-directory-2026-27
          path: |
            data/registry/state_dl_programs_oregon.csv
            data/registry/oregon_2026_27_extraction_audit.csv
            data/registry/oregon_2026_27_summary.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit extracted program records
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            data/registry/state_dl_programs_oregon.csv \
            data/registry/oregon_2026_27_extraction_audit.csv \
            data/registry/oregon_2026_27_summary.json

          if ! git diff --cached --quiet; then
            git commit -m \
              'Update Oregon dual-language directory 2026-27'
            git push
          fi
