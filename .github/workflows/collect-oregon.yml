
name: Collect Oregon Dual Language Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-oregon:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pymupdf

      - name: Create output directory
        run: |
          mkdir -p data/registry/oregon_repaired

      - name: Collect Oregon directory
        run: |
          python3 collectors/oregon.py

      - name: Verify original outputs
        run: |
          test -f data/registry/state_dl_programs_oregon.csv
          test -f data/registry/oregon_2026_27_extraction_audit.csv
          test -f data/registry/oregon_2026_27_summary.json

      - name: Repair Oregon extraction
        run: |
          python3 analysis/state_dl/oregon/repair_extraction.py \
            --audit data/registry/oregon_2026_27_extraction_audit.csv \
            --programs data/registry/state_dl_programs_oregon.csv \
            --out data/registry/oregon_repaired

      - name: Display repair summary
        run: |
          echo "OREGON REPAIR SUMMARY"
          cat data/registry/oregon_repaired/repair_report.json

      - name: Upload Oregon outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oregon-dual-language-results
          path: |
            data/registry/state_dl_programs_oregon.csv
            data/registry/oregon_2026_27_extraction_audit.csv
            data/registry/oregon_2026_27_summary.json
            data/registry/oregon_repaired/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit updated Oregon data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/registry/state_dl_programs_oregon.csv \
            data/registry/oregon_2026_27_extraction_audit.csv \
            data/registry/oregon_2026_27_summary.json \
            data/registry/oregon_repaired/

          if ! git diff --cached --quiet; then
            git commit -m "Update Oregon dual-language extraction and repair audit"
            git push
          fi
