
name: Collect Washington dual-language inventory

on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 1 * *'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and audit WA records
        run: python3 collectors/washington.py

      - name: Normalize Spanish dual-language programs
        run: python3 collectors/normalize_washington.py

      - name: Preserve outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: washington-dl-inventory-${{ github.run_number }}
          path: output/washington/
          if-no-files-found: warn
          retention-days: 90
