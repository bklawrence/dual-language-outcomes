
name: Collect Washington DL inventory, academics, and enrollment

on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 1 * *'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Washington DL program inventory
        run: python3 collectors/washington.py

      - name: Normalize all-language DL programs
        run: python3 collectors/normalize_washington.py

      - name: Collect Washington academic results
        run: python3 collectors/washington_academics.py

      - name: Collect Washington enrollment and demographics
        run: python3 collectors/washington_enrollment.py

      - name: Upload research data and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: washington-research-${{ github.run_number }}
          path: output/washington/
          if-no-files-found: warn
          retention-days: 90
