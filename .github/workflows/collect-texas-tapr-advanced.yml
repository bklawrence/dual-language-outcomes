
name: Collect Texas TAPR advanced data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-texas-tapr:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check scripts and pilot inputs
        run: |
          python3 -m py_compile \
            collectors/texas_tapr_advanced_collect.py \
            collectors/texas_tapr_public_import.py
          python3 - <<'PY'
          import csv
          from pathlib import Path

          for name in (
              'tapr_pilot_campuses_pass46.csv',
              'tapr_pilot_join_pass45.csv',
          ):
              path = Path('data/registry/texas') / name
              with path.open(
                  encoding='utf-8-sig',
                  newline=''
              ) as f:
                  records = list(
                      csv.DictReader(
                          line for line in f
                          if line.strip()
                      )
                  )
              print(f'{name}: {len(records)} records')
          PY

      - name: Install Playwright and Chromium
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            playwright==1.56.0
          python3 -m playwright install --with-deps chromium

      - name: Collect data from the public TEA site
        id: collect
        continue-on-error: true
        run: |
          python3 collectors/texas_tapr_advanced_collect.py \
            --outdir results/texas/tapr_download

      - name: Import downloaded data into pilot audit
        id: import
        if: ${{ steps.collect.outcome == 'success' }}
        run: |
          python3 collectors/texas_tapr_public_import.py \
            --csv results/texas/tapr_download/tapr_2024_campus_additional_grades3to8.csv \
            --outdir results/texas/tapr_public

      - name: Record step outcomes
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          IMPORT_OUTCOME: ${{ steps.import.outcome }}
        run: |
          mkdir -p results/texas
          printf 'Collection: %s\nImport: %s\n' \
            "$COLLECT_OUTCOME" "$IMPORT_OUTCOME" \
            > results/texas/collector_status.txt

      - name: Upload download diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-tapr-diagnostics-${{ github.run_number }}
          path: |
            results/texas/collector_status.txt
            results/texas/tapr_download/diagnostics/
            results/texas/tapr_download/download_receipt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload imported pilot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-tapr-results-${{ github.run_number }}
          path: results/texas/tapr_public/
          if-no-files-found: ignore
          retention-days: 30

      - name: Mark unsuccessful collection as failed
        if: ${{ steps.collect.outcome != 'success' }}
        run: |
          echo 'TEA download unsuccessful. See the diagnostics artifact and collector log.'
          exit 1
