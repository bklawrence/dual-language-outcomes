
name: Collect Texas TAPR advanced data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texas-tapr:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright Chromium
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.61.0
          python3 -m playwright install --with-deps chromium

      - name: Collect, join, and audit Texas schools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/texas
          stage='start'
          trap 'printf "Last stage: %s\nExit code: %s\n" "$stage" "$?" > results/texas/collector_status.txt' EXIT

          stage='syntax-check'
          python3 -m py_compile \
            collectors/texas_tapr_advanced_collect.py \
            collectors/texas_tapr_public_import.py \
            scripts/build_texas_master_pass44.py \
            scripts/texas_tapr_registry_crosswalk.py \
            scripts/texas_structure_recovery_pass47.py

          stage='TEA-download'
          python3 collectors/texas_tapr_advanced_collect.py \
            --outdir results/texas/tapr_download

          stage='verify-downloads'
          for category in grade3 grade4 grade5 bilingual_all_grades; do
            test -s "results/texas/tapr_download/tapr_2024_${category}.zip"
          done

          stage='statewide-import'
          python3 collectors/texas_tapr_public_import.py \
            --csv results/texas/tapr_download/tapr_2024_grade3.zip \
            --csv results/texas/tapr_download/tapr_2024_grade4.zip \
            --csv results/texas/tapr_download/tapr_2024_grade5.zip \
            --csv results/texas/tapr_download/tapr_2024_bilingual_all_grades.zip \
            --outdir results/texas/tapr_public

          stage='historical-master'
          python3 scripts/build_texas_master_pass44.py
          cp data/registry/texas/texas_master_pass44.csv \
            results/texas/tapr_public/texas_master_pass44.csv

          if test -s data/registry/texas/texas_master_pass44_compact_manifest.json; then
            cp data/registry/texas/texas_master_pass44_compact_manifest.json \
              results/texas/tapr_public/
          fi

          stage='historical-crosswalk'
          python3 scripts/texas_tapr_registry_crosswalk.py \
            --registry data/registry/texas/texas_master_pass44.csv \
            --campuses results/texas/tapr_public/statewide_campus_index.csv \
            --program-meets results/texas/tapr_public/statewide_program_meets.csv \
            --outdir results/texas/tapr_public

          stage='Pass-47-structure-recovery'
          python3 scripts/texas_structure_recovery_pass47.py \
            --master data/registry/texas/texas_master_pass44.csv \
            --outdir results/texas/structure_pass47

          stage='validate'
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          public = Path('results/texas/tapr_public')
          structure = Path('results/texas/structure_pass47')

          statewide = json.loads(
              (public / 'statewide_summary.json').read_text()
          )

          crosswalk = json.loads(
              (public / 'texas_registry_tapr_summary.json').read_text()
          )

          def first_existing(*names):
              for name in names:
                  candidate = structure / name
                  if candidate.is_file():
                      return candidate
              raise SystemExit(
                  'Missing Pass 47 output: ' + ', '.join(names)
              )

          structure_summary = json.loads(
              first_existing(
                  'texas_structure_summary_pass47.json',
                  'structure_summary_pass47.json'
              ).read_text()
          )

          campus_csv = first_existing(
              'texas_structure_campus_pass47.csv',
              'structure_campus_pass47.csv'
          )

          first_existing(
              'texas_structure_evidence_pass47.csv',
              'structure_evidence_pass47.csv'
          )

          with campus_csv.open(
              encoding='utf-8-sig',
              newline=''
          ) as f:
              structure_campuses = sum(
                  1 for _ in csv.DictReader(f)
              )

          assert statewide['matched_distinct_pilot_campuses'] == 66
          assert statewide['statewide_distinct_campuses'] >= 9000
          assert crosswalk['historical_records'] == 1856
          assert crosswalk['distinct_historical_campuses'] == 1610
          assert structure_campuses == 1610

          print(
              'Statewide TAPR campuses:',
              statewide['statewide_distinct_campuses']
          )

          print(
              'Historical campus matches:',
              crosswalk['matched_distinct_historical_campuses']
          )

          print(
              'Pass 47 campus rows:',
              structure_campuses
          )

          print(
              'Pass 47 structure summary:',
              json.dumps(structure_summary, indent=2)
          )
          PY

          stage='SUCCESS'
          echo 'Texas TAPR, historical master, and Pass 47 completed.'

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-tapr-diagnostics-${{ github.run_number }}
          path: |
            results/texas/collector_status.txt
            results/texas/tapr_download/diagnostics/
            results/texas/tapr_download/download_receipt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload TEA source archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-tapr-source-archives-${{ github.run_number }}
          path: results/texas/tapr_download/*.zip
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload statewide outcomes and structure audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-tapr-results-${{ github.run_number }}
          path: |
            results/texas/tapr_public/
            results/texas/structure_pass47/
          if-no-files-found: warn
          retention-days: 30
