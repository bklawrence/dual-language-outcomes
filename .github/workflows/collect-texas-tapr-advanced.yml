
name: Collect Texas TAPR advanced data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-texas-tapr:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate collector and importer
        run: |
          python3 -m py_compile \
            collectors/texas_tapr_advanced_collect.py \
            collectors/texas_tapr_public_import.py

      - name: Install Playwright and Chromium
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            playwright==1.61.0

          python3 -m playwright install \
            --with-deps chromium

      - name: Collect statewide TEA category exports
        id: collect
        continue-on-error: true
        run: |
          python3 collectors/texas_tapr_advanced_collect.py \
            --outdir results/texas/tapr_download

      - name: Import candidate program columns
        id: import
        if: ${{ steps.collect.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 collectors/texas_tapr_public_import.py \
            --csv results/texas/tapr_download/tapr_2024_grade3.zip \
            --csv results/texas/tapr_download/tapr_2024_grade4.zip \
            --csv results/texas/tapr_download/tapr_2024_grade5.zip \
            --csv results/texas/tapr_download/tapr_2024_bilingual_all_grades.zip \
            --outdir results/texas/tapr_public

      - name: Save run status
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          IMPORT_OUTCOME: ${{ steps.import.outcome }}
        run: |
          mkdir -p results/texas

          printf 'Collection: %s\nImport: %s\n' \
            "$COLLECT_OUTCOME" "$IMPORT_OUTCOME" \
            > results/texas/collector_status.txt

      - name: Upload diagnostics and download receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-tapr-diagnostics-${{ github.run_number }}
          path: |
            results/texas/collector_status.txt
            results/texas/tapr_download/diagnostics/
            results/texas/tapr_download/download_receipt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload public source archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-tapr-source-archives-${{ github.run_number }}
          path: results/texas/tapr_download/*.zip
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload pilot import audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-tapr-results-${{ github.run_number }}
          path: results/texas/tapr_public/
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail if collection or import failed
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          IMPORT_OUTCOME: ${{ steps.import.outcome }}
        run: |
          if [ "$COLLECT_OUTCOME" != success ] || [ "$IMPORT_OUTCOME" != success ]; then
            echo "See diagnostics and available source archives."
            exit 1
          fi
