
name: Collect Texas TAPR advanced data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-texas-tapr:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python scripts
        run: |
          python3 -m py_compile \
            collectors/texas_tapr_advanced_collect.py \
            collectors/texas_tapr_public_import.py \
            scripts/build_texas_master_pass44.py \
            scripts/texas_tapr_registry_crosswalk.py

      - name: Install Playwright
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            playwright==1.61.0
          python3 -m playwright install --with-deps chromium

      - name: Check original pilot inputs
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          base = Path('data/registry/texas')
          required = {
              'tapr_pilot_campuses_pass46.csv': 66,
              'tapr_pilot_join_pass45.csv': 134,
          }

          for name, expected in required.items():
              path = base / name
              if not path.is_file():
                  raise SystemExit(f'Missing file: {path}')

              with path.open(
                  encoding='utf-8-sig',
                  newline=''
              ) as f:
                  count = sum(
                      1 for _ in csv.DictReader(f)
                  )

              print(f'{name}: {count} rows')

              if count != expected:
                  raise SystemExit(
                      f'Expected {expected} rows in {name}'
                  )
          PY

      - name: Download TEA statewide source data
        id: collect
        continue-on-error: true
        run: |
          python3 collectors/texas_tapr_advanced_collect.py \
            --outdir results/texas/tapr_download

      - name: Verify four source archives
        id: archives
        if: ${{ steps.collect.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail

          for category in grade3 grade4 grade5 bilingual_all_grades; do
            path="results/texas/tapr_download/tapr_2024_${category}.zip"

            if [ ! -s "$path" ]; then
              echo "Missing: $path"
              exit 1
            fi

            echo "Found: $path"
          done

      - name: Import statewide TAPR data
        id: import
        if: ${{ steps.archives.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 collectors/texas_tapr_public_import.py \
            --csv results/texas/tapr_download/tapr_2024_grade3.zip \
            --csv results/texas/tapr_download/tapr_2024_grade4.zip \
            --csv results/texas/tapr_download/tapr_2024_grade5.zip \
            --csv results/texas/tapr_download/tapr_2024_bilingual_all_grades.zip \
            --outdir results/texas/tapr_public

      - name: Validate statewide TAPR import
        id: verify_import
        if: ${{ steps.import.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path('results/texas/tapr_public')

          for name in (
              'statewide_campus_index.csv',
              'statewide_program_meets.csv',
              'statewide_summary.json',
          ):
              if not (base / name).is_file():
                  raise SystemExit(
                      f'Missing: {name}'
                  )

          result = json.loads(
              (base / 'statewide_summary.json').read_text()
          )

          print(
              'Statewide campuses:',
              result['statewide_distinct_campuses']
          )

          print(
              'Pilot matches:',
              result['matched_distinct_pilot_campuses']
          )

          if result['matched_distinct_pilot_campuses'] != 66:
              raise SystemExit(
                  '66-campus pilot coverage regressed'
              )

          if result['statewide_distinct_campuses'] < 9000:
              raise SystemExit(
                  'Unexpectedly few statewide campuses'
              )
          PY

      - name: Reconstruct full Texas Pass 44 policy registry
        id: historical_master
        if: ${{ steps.verify_import.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 scripts/build_texas_master_pass44.py

          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path(
              'data/registry/texas/texas_master_pass44.csv'
          )

          if not path.is_file():
              raise SystemExit(
                  f'Missing historical master: {path}'
              )

          with path.open(
              encoding='utf-8-sig',
              newline=''
          ) as f:
              rows = list(csv.DictReader(f))

          campuses = {
              r.get('campus_id', '')
              for r in rows
          }

          print('Historical records:', len(rows))
          print(
              'Distinct historical campuses:',
              len(campuses)
          )

          if len(rows) != 1856 or len(campuses) != 1610:
              raise SystemExit(
                  'Historical registry totals did not validate'
              )
          PY

          mkdir -p results/texas/tapr_public

          cp data/registry/texas/texas_master_pass44.csv \
            results/texas/tapr_public/texas_master_pass44.csv

          manifest=data/registry/texas/texas_master_pass44_compact_manifest.json

          if [ -s "$manifest" ]; then
            cp "$manifest" results/texas/tapr_public/
          fi

      - name: Join historical program records to statewide TAPR
        id: crosswalk
        if: ${{ steps.historical_master.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 scripts/texas_tapr_registry_crosswalk.py \
            --registry data/registry/texas/texas_master_pass44.csv \
            --campuses results/texas/tapr_public/statewide_campus_index.csv \
            --program-meets results/texas/tapr_public/statewide_program_meets.csv \
            --outdir results/texas/tapr_public

      - name: Validate historical crosswalk
        id: verify_crosswalk
        if: ${{ steps.crosswalk.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              'results/texas/tapr_public/'
              'texas_registry_tapr_summary.json'
          )

          info = json.loads(path.read_text())

          print(
              'Historical source:',
              info['registry_scope']
          )

          print(
              'Historical records:',
              info['historical_records']
          )

          print(
              'Distinct campuses:',
              info['distinct_historical_campuses']
          )

          print(
              'Matched campuses:',
              info['matched_distinct_historical_campuses']
          )

          print(
              'Campuses with matching program outcomes:',
              info[
                  'distinct_historical_campuses_with_same_named_program_numeric_meets'
              ]
          )

          if info['historical_records'] != 1856:
              raise SystemExit(
                  'Crosswalk fell back to the pilot'
              )

          if info['distinct_historical_campuses'] != 1610:
              raise SystemExit(
                  'Crosswalk has wrong campus count'
              )
          PY

      - name: Save status report
        if: always()
        env:
          COLLECT: ${{ steps.collect.outcome }}
          ARCHIVES: ${{ steps.archives.outcome }}
          IMPORT: ${{ steps.import.outcome }}
          VERIFY_IMPORT: ${{ steps.verify_import.outcome }}
          HISTORICAL_MASTER: ${{ steps.historical_master.outcome }}
          CROSSWALK: ${{ steps.crosswalk.outcome }}
          VERIFY_CROSSWALK: ${{ steps.verify_crosswalk.outcome }}
        run: |
          mkdir -p results/texas

          {
            echo "Collection: $COLLECT"
            echo "Archives: $ARCHIVES"
            echo "Import: $IMPORT"
            echo "Import validation: $VERIFY_IMPORT"
            echo "Historical master: $HISTORICAL_MASTER"
            echo "Historical crosswalk: $CROSSWALK"
            echo "Crosswalk validation: $VERIFY_CROSSWALK"
          } > results/texas/collector_status.txt

          cat results/texas/collector_status.txt

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-tapr-diagnostics-${{ github.run_number }}
          path: |
            results/texas/collector_status.txt
            results/texas/tapr_download/diagnostics/
            results/texas/tapr_download/download_receipt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload TEA source archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-tapr-source-archives-${{ github.run_number }}
          path: results/texas/tapr_download/*.zip
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload statewide results and historical master
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-tapr-results-${{ github.run_number }}
          path: results/texas/tapr_public/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce workflow success
        if: always()
        env:
          COLLECT: ${{ steps.collect.outcome }}
          ARCHIVES: ${{ steps.archives.outcome }}
          IMPORT: ${{ steps.import.outcome }}
          VERIFY_IMPORT: ${{ steps.verify_import.outcome }}
          HISTORICAL_MASTER: ${{ steps.historical_master.outcome }}
          CROSSWALK: ${{ steps.crosswalk.outcome }}
          VERIFY_CROSSWALK: ${{ steps.verify_crosswalk.outcome }}
        run: |
          for step in \
            "$COLLECT" "$ARCHIVES" "$IMPORT" "$VERIFY_IMPORT" \
            "$HISTORICAL_MASTER" "$CROSSWALK" "$VERIFY_CROSSWALK"; do

            if [ "$step" != "success" ]; then
              echo "Workflow failed or skipped a required step."
              exit 1
            fi
          done

          echo "Statewide TAPR and historical Texas registry joined."
