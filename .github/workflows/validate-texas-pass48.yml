
name: Validate Texas Pass 48

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Texas research checkpoint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Pass 48
        run: python3 scripts/validate_texas_pass48.py
