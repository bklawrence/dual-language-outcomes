
name: Collect Texas TAPR dual-language assessment groups

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tapr:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser dependencies
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium

      - name: Verify collectors
        run: |
          test -f collectors/texas.py
          test -f collectors/texas_tapr_dli.py

      - name: Refresh campus roster
        run: python3 collectors/texas.py --out output/texas

      - name: Collect and validate 2023-24 TAPR DLI groups
        run: |
          python3 collectors/texas_tapr_dli.py \
            --roster output/texas/tx_2024_25_all_campuses.csv \
            --out output/texas/tapr \
            --wait-seconds 180

      - name: Print TAPR diagnostics
        if: always()
        run: |
          if test -f output/texas/tapr/tx_tapr_download_debug.json; then
            cat output/texas/tapr/tx_tapr_download_debug.json
          fi
          if test -f output/texas/tapr/tx_tapr_collector_failure.json; then
            cat output/texas/tapr/tx_tapr_collector_failure.json
          fi
          if test -f output/texas/tapr/tx_tapr_2023_24_report.json; then
            cat output/texas/tapr/tx_tapr_2023_24_report.json
          fi

      - name: Upload source, extraction and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-tapr-${{ github.run_number }}
          path: output/texas/tapr/
          if-no-files-found: warn
          retention-days: 90
