nt":"\u003cp class=\"wp-block-paragraph\"\u003eWorld Languages education in Georgia includes the study of modern languages, classical languages, American Sign Language, and Dual Language Immersion. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eHigh school students can complete a World Languages Pathway. Additionally, high school seniors may earn both the Georgia Seal of Biliteracy and the International Skills Diploma Seal.\u003c/p\u003e\n\n\n\n\u003cfigure class=\"wp-block-image size-large\"\u003e\u003cimg loading=\"lazy\" decoding=\"async\" width=\"1024\" height=\"604\" src=\"https://cdn-cms-gadoe-org-fpf4gke0fwd4htef.a03.azurefd.net/app/uploads/2024/08/World-People-1024x604.jpg\" alt=\"Decorative image of the continents.\" class=\"wp-image-4559\" srcset=\"https://gadoe.org/app/uploads/2024/08/World-People-1024x604.jpg 1024w, https://gadoe.org/app/uploads/2024/08/World-People-300x177.jpg 300w, https://gadoe.org/app/uploads/2024/08/World-People-768x453.jpg 768w, https://gadoe.org/app/uploads/2024/08/World-People-1536x906.jpg 1536w, https://gadoe.org/app/uploads/2024/08/World-People-2048x1208.jpg 2048w\" sizes=\"auto, (max-width: 1024px) 100vw, 1024px\"\u003e\u003c/figure\u003e\n\n\n\n\u003cdiv class=\"call-out-box bg-gadoeBlueGreen-200\"\u003e\u003ch2 id=\"world-languages-standards-and-instructional-resources\" class=\"text-gadoeGray-800 text-2xl lg:text-3xl group relative flex\"\u003eWorld Languages Standards and Instructional Resources \u003c/h2\u003e\u003cp class=\"text-gadoeGray-800 mb-2 typography lg:typography-lg\"\u003e\u003ca href=\"https://case.georgiastandards.org/\" target=\"_blank\" rel=\"nofollow noreferrer noopener\"\u003eGaDOE SuitCASE for World Language\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://inspire.gadoe.org/courses/World_Languages\" target=\"_blank\"\u003eGaDOE Inspire for World Language\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://url.gadoe.org/ydatz\" target=\"_blank\"\u003eGuidance for Credit in Lieu of Enrollment for Native Speakers\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://url.gadoe.org/rpvb7\" target=\"_blank\"\u003eDual Language Immersion Information for Families\u003c/a\u003e\u003c/p\u003e\u003c/div\u003e\n\n\n\n\u003cdiv class=\"call-out-box bg-gadoeBlue-50\"\u003e\u003ch2 id=\"frequently-requested-information\" class=\"text-gadoeGray-800 text-2xl lg:text-3xl group relative flex\"\u003eFrequently Requested Information\u003c/h2\u003e\u003cp class=\"text-gadoeGray-800 mb-2 typography lg:typography-lg\"\u003eStudents can complete the \u003cstrong\u003eWorld Languages Pathway\u003c/strong\u003e when the criteria described below have been met. The student’s course history in \u003cstrong\u003eone\u003c/strong\u003e world language includes:\u003cbr\u003e3 distinct high school courses in the same world language, or\u003cbr\u003e2 distinct high school courses in the same world language plus a third course reflecting an Advanced Placement (AP) language course, an International Baccalaureate (IB) course, or a post-secondary course.  \u003cbr\u003e\u003cbr\u003e\u003ca href=\"https://url.gadoe.org/z4gx2\" target=\"_blank\"\u003eWorld Languages Pathway Guidance at a Glance\u003c/a\u003e\u003cbr\u003e\u003cbr\u003eGaDOE offers two recognitions for high school seniors: the \u003cstrong\u003eInternational Skills Diploma Seal\u003c/strong\u003e and the \u003cstrong\u003eGeorgia Seal of Biliteracy\u003c/strong\u003e. The seals are awarded to students who demonstrate proficiency in English and another language as well as those who are engaged in intercultural communication and global studies. Both seals aim to promote language skills and cultural understanding among students, preparing them for continued education and successful careers.\u003c/p\u003e\u003c/div\u003e\n","pageOptions":{"__typename":"PageOptions","breadcrumbsTitleOverride":null,"featuredOnlySearch":false,"newsletterGadoeOffice":null,"hasPressReleasesSection":false,"linkedPressReleasesHeading":null,"linkedPressRe ntId":"cG9zdDo4OTY=","databaseId":921,"path":"/district-schools/","label":"Districts \u0026 Schools","cssClasses":[],"target":null,"connectedNode":{"__typename":"MenuItemToMenuItemLinkableConnectionEdge","node":{"__typename":"Page","databaseId":888}},"menu":{"__typename":"MenuItemToMenuConnectionEdge","node":{"__typename":"Menu","name":"Main Navigation"}}}]},"googleAnalyticsSettings":{"__typename":"GoogleAnalyticsType","googleAnalyticsID":"G-ZBLBHPVQP6"}},"__TEMPLATE_VARIABLES__":{"databaseId":266,"headerLocation":"PRIMARY","footerLocation":"FOOTER","asPreview":false,"includeSeo":true},"__FAUST_QUERIES__":null,"appEnv":"production","__APOLLO_STATE__":{"Page:cG9zdDoyNjY=":{"__typename":"Page","uri":"/learning/world-languages-global-initiatives/","id":"cG9zdDoyNjY=","databaseId":266,"isContentNode":true,"slug":"world-languages-global-initiatives","contentType":{"__typename":"ContentNodeToContentTypeConnectionEdge","node":{"__typename":"ContentType","name":"page"}},"template":{"__typename":"DefaultTemplate","templateName":"Default"},"isFrontPage":false,"isPostsPage":false,"title":"World Languages \u0026 Global Initiatives","link":"https://gadoe.org/learning/world-languages-global-initiatives/","pageOptions":{"__typename":"PageOptions","hideFromNav":false,"isPlaceholderPage":false,"placeholderLink":null},"children({\"where\":{\"orderby\":[{\"field\":\"MENU_ORDER\",\"order\":\"ASC\"},{\"field\":\"TITLE\",\"order\":\"ASC\"}]}})":{"__typename":"HierarchicalContentNodeToContentNodeChildrenConnection","nodes":[]}},"ROOT_QUERY":{"__typename":"RootQuery","nodeByUri({\"uri\":\"/learning/world-languages-global-initiatives\"})":{"__ref":"Page:cG9zdDoyNjY="},"page({\"asPreview\":false,\"id\":266,\"idType\":\"DATABASE_ID\"})":{"__typename":"Page","databaseId":266,"title":"World Languages \u0026 Global Initiatives","content":"\u003cp class=\"wp-block-paragraph\"\u003eWorld Languages education in Georgia includes the study of modern languages, classical languages, American Sign Language, and Dual Language Immersion. \u003c/p\u003e\n\n\n\n\u003cp class=\"wp-block-paragraph\"\u003eHigh school students can complete a World Languages Pathway. Additionally, high school seniors may earn both the Georgia Seal of Biliteracy and the International Skills Diploma Seal.\u003c/p\u003e\n\n\n\n\u003cfigure class=\"wp-block-image size-large\"\u003e\u003cimg loading=\"lazy\" decoding=\"async\" width=\"1024\" height=\"604\" src=\"https://cdn-cms-gadoe-org-fpf4gke0fwd4htef.a03.azurefd.net/app/uploads/2024/08/World-People-1024x604.jpg\" alt=\"Decorative image of the continents.\" class=\"wp-image-4559\" srcset=\"https://gadoe.org/app/uploads/2024/08/World-People-1024x604.jpg 1024w, https://gadoe.org/app/uploads/2024/08/World-People-300x177.jpg 300w, https://gadoe.org/app/uploads/2024/08/World-People-768x453.jpg 768w, https://gadoe.org/app/uploads/2024/08/World-People-1536x906.jpg 1536w, https://gadoe.org/app/uploads/2024/08/World-People-2048x1208.jpg 2048w\" sizes=\"auto, (max-width: 1024px) 100vw, 1024px\"\u003e\u003c/figure\u003e\n\n\n\n\u003cdiv class=\"call-out-box bg-gadoeBlueGreen-200\"\u003e\u003ch2 id=\"world-languages-standards-and-instructional-resources\" class=\"text-gadoeGray-800 text-2xl lg:text-3xl group relative flex\"\u003eWorld Languages Standards and Instructional Resources \u003c/h2\u003e\u003cp class=\"text-gadoeGray-800 mb-2 typography lg:typography-lg\"\u003e\u003ca href=\"https://case.georgiastandards.org/\" target=\"_blank\" rel=\"nofollow noreferrer noopener\"\u003eGaDOE SuitCASE for World Language\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://inspire.gadoe.org/courses/World_Languages\" target=\"_blank\"\u003eGaDOE Inspire for World Language\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://url.gadoe.org/ydatz\" target=\"_blank\"\u003eGuidance for Credit in Lieu of Enrollment for Native Speakers\u003c/a\u003e\u003cbr\u003e\u003ca href=\"https://url.gadoe.org/rpvb7\" target=\"_blank\"\u003eDual Language Immersion Information for Families\u003c/a\u003e\u003c/p\u003e\u003c/div\u003e\n\n\n\n\u003cdiv class=\"call-out-box bg-gadoeBlue-50\"\u003e\u003ch2 id=\"frequently-requested-information\" class=\"text-gadoeGray-800 text-2xl lg:text-3xl group relative flex\"\u003eFrequently Requested Information\u003c/h2\u003e\u003cp class=\"text-gadoeGray-800 mb-2 typography lg:typography-lg\"\u003eStudents can complete the \u003cstrong\u003eWorld Languages Pathway\u003c/strong\u003e when the criteria described below have been met. The student’s course history in \u003cstrong\u003eone\u003c/strong\u003e world language includes:\u003cbr\u003e3 distinct high school courses in the same world language, or\u003cbr\u003e2 distinct high school courses in the same world language plus a third course reflecting an Advanced Placement (AP) language course, an International Baccalaureate (IB) course, or a post-secondary course.  \u003cbr\u003e\u003cbr\u003e\u003ca href=\"https://url.gadoe.org/z4gx2\" target=\"_blank\"\u003eWorld Languages Pathway Guidance at a Glance\u003c/a\u003e\u003cbr\u003e\u003cbr\u003eGaDOE offers two recognitions for high school seniors: the \u003cstrong\u003eInternational Skills Diploma Seal\u003c/strong\u003e and the \u003cstrong\u003eGeorgia Seal of Biliteracy\u003c/strong\u003e. The seals are awarded to students who demonstrate proficiency in English and another language as well as those who are engaged in intercultural communication and global studies. Both seals aim to promote language skills and cultural understanding among students, preparing them for continued education and successful careers.\u003c/p\u003e\u003c/div\u003e\n","parent":{"__typename":"HierarchicalContentNodeToParentContentNodeConnectionEdge","node":{"__ref":"Page:cG9zdDoyMjI="}},"children({\"where\":{\"orderby\":[{\"field\":\"MENU_ORDER\",\"order\":\"ASC\"},{\"field\":\"TITLE\",\"order\":\"ASC\"}]}})":{"__typename":"HierarchicalContentNodeToContentNodeChildrenConnection","nodes":[]},"siblings({\"where\":{\"includeCurrent\":true, \" class=\"text-gadoeGray-800 text-2xl lg:text-3xl group relative flex\"\u003eFrequently Requested Information\u003c/h2\u003e\u003cp class=\"text-gadoeGray-800 mb-2 typography lg:typography-lg\"\u003eStudents can complete the \u003cstrong\u003eWorld Languages Pathway\u003c/strong\u003e when the criteria described below have been met. The student's course history in \u003cstrong\u003eone\u003c/strong\u003e world language includes:\u003cbr\u003e3 distinct high school courses in the same world language, or\u003cbr\u003e2 distinct high school courses in the same world language plus a third course reflecting an Advanced Placement (AP) language course, an International Baccalaureate (IB) course, or a post-secondary course.  \u003cbr\u003e\u003cbr\u003e\u003ca href=\"https://url.gadoe.org/z4gx2\" target=\"_blank\"\u003eWorld Languages Pathway Guidance at a Glance\u003c/a\u003e\u003cbr\u003e\u003cbr\u003eGaDOE offers two recognitions for high school seniors: the \u003cstrong\u003eInternational Skills Diploma Seal\u003c/strong\u003e and the \u003cstrong\u003eGeorgia Seal of Biliteracy\u003c/strong\u003e. The seals are awarded to students who demonstrate proficiency in English and another language as well as those who are engaged in intercultural communication and global studies. Both seals aim to promote language skills and cultural understanding among students, preparing them for continued education and successful careers.\u003c/p\u003e\u003c/div\u003e\n","parentClientId":null,"attributes":{"__typename":"GadoeCallOutBoxAttributes","title":"Frequently Requested Information","richText":"Students can complete the \u003cstrong\u003eWorld Languages Pathway\u003c/strong\u003e when the criteria described below have been met. The student's course history in \u003cstrong\u003eone\u003c/strong\u003e world language includes:\u003cbr\u003e3 distinct high school courses in the same world language, or\u003cbr\u003e2 distinct high school courses in the same world language plus a third course reflecting an Advanced Placement (AP) language course, an International Baccalaureate (IB) course, or a post-secondary course.  \u003cbr\u003e\u003cbr\u003e\u003ca href=\"https://url.gadoe.org/z4gx2\" target=\"_blank\"\u003eWorld Languages Pathway Guidance at a Glance\u003c/a\u003e\u003cbr\u003e\u003cbr\u003eGaDOE offers two recognitions for high school seniors: the \u003cstrong\u003eInternational Skills Diploma Seal\u003c/strong\u003e and the \u003cstrong\u003eGeorgia Seal of Biliteracy\u003c/strong\u003e. The seals are awarded to students who demonstrate proficiency in English and another language as well as those who are engaged in intercultural communication and global studies. Both seals aim to promote language skills and cultural understanding among students, preparing them for continued education and successful careers.","boxBackgroundColor":"bg-gadoeBlue-50","boxType":"","linkHref":"","linkText":"Learn More","anchor":null},"id":"1a928525ee6d5"},"EnqueuedScript:ZW5xdWV1ZWRfc2NyaXB0OmFwcC8w":{"__typename":"EnqueuedScript","id":"ZW5xdWV1ZWRfc2NyaXB0OmFwcC8w","handle":"app/0","src":"https://cms.gadoe.org/app/themes/gadoe/public/js/app.59e82e.js","dependencies":null},"FontAwesomeIcon:facebook":{"__typename":"FontAwesomeIcon","id":"facebook"},"FontAwesomeIcon:x-twitter":{"__typename":"FontAwesomeIcon","id":"x-twitter"},"FontAwesomeIcon:instagram":{"__typename":"FontAwesomeIcon","id":"instagram"},"FontAwesomeIcon:youtube":{"__typename":"FontAwesomeIcon","id":"youtube"},"FontAwesomeIcon:face-laugh":{"__typename":"FontAwesomeIcon","id":"face-laugh"},"Page:cG9zdDo3Nzg=":{"__typename":"Page","id":"cG9zdDo3Nzg=","databaseId":778,"title":"Press Releases","link":"https://gadoe.org/contact/press-releases/","pageOptions":{"__typename":"PageOptions","hideFromNav":false,"isPlaceholderPage":false,"placeholderLink":null},"children({\"where\":{\"orderby\":[{\"field\":\"MENU_ORDER\",\"order\":\"ASC\"},{\"field\":\"TITLE\",\"order\":\"ASC\"}]}})":{"__typename":"HierarchicalCon
